<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Neuronales Netz</title>
    <meta
      name="description"
      content="Interaktive 3D-Demo: Sieh zu, wie ein neuronales Netz lernt, handgezeichnete Dreiecke, Rechtecke und Kreise zu erkennen."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='6' cy='16' r='4' fill='%234da3ff'/%3E%3Ccircle cx='16' cy='8' r='4' fill='%2335e39b'/%3E%3Ccircle cx='16' cy='24' r='4' fill='%2335e39b'/%3E%3Ccircle cx='26' cy='16' r='4' fill='%23ff5c8a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mode-training">
    <div id="stage" aria-label="3D-Ansicht des neuronalen Netzes"></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <div class="hud">
      <header class="brand">
        <h1>Wie ein neuronales Netz Formen lernt</h1>
        <p>
          Sieh zu, wie es mit <span class="c-input">▲</span>
          <span class="c-hidden">■</span>
          <span class="c-output">●</span>-Zeichnungen trainiert.
        </p>
      </header>

      <div class="panel legend" aria-label="Legende">
        <span><i class="dot" style="--c: var(--input)"></i>Input</span>
        <span><i class="dot" style="--c: var(--hidden)"></i>Hidden Layer</span>
        <span><i class="dot" style="--c: var(--output)"></i>Output</span>
        <span><i class="dot diamond" style="--c: var(--bias)"></i>Bias</span>
        <span><i class="line" style="--c: var(--pos)"></i>+ Gewicht</span>
        <span><i class="line" style="--c: var(--neg)"></i>− Gewicht</span>
        <span><i class="dot small" style="--c: var(--fwd)"></i>Vorwärts</span>
        <span><i class="dot small" style="--c: var(--back)"></i>Backprop</span>
        <span class="byline">
          by <a href="https://patrickbecker.work" target="_blank" rel="noopener">Patrick Becker</a>
        </span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
